[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-private-credential-example"
version = "0.1.0"
description = "Explicit private credential alias pack example"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["leakguard-core>=0.2.1a1,<0.3", "leakguard-credential-detector>=0.1.0a1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_credential_pack = ["aliases.json", "cases.json", "leakguard-plugin.json"]
