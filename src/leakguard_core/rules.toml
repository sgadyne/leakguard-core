title = "Generic offline credential detection"

[extend]
useDefault = true

[[rules]]
id = "credential-connection-url"
description = "Database or message broker URL containing literal userinfo with a password"
# Lexical matching only: the authority is constrained, but DNS/IP addresses and
# URL path/query syntax are not fully validated; bracketed IP forms can still
# be invalid. Literal userinfo is restricted to the character set below (no
# raw dollar sign or Unicode); percent escapes require two hex digits and
# reject ASCII control octets 00-1F and 7F and UTF-8 encoded C1 controls. Other
# high bytes are not interpreted and may be non-UTF-8 controls. Gitleaks can
# independently decode input before
# applying this rule, including nested Base64 and percent-encoded input.
# An invalid leading character is consumed and rejected by the match allowlist;
# valid starts use a zero-width boundary so adjacent matches are not masked.
regex = '''(?im)(?:[^\s"'=({,;\[\]})]|\b)((?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqp|amqps)://(?:[a-z0-9._~!*+;=-]|%(?:[2-6][0-9a-f]|7[0-9a-e]|[89a-f][0-9a-f]))*:(?:[a-z0-9._~!*+;=:-]|%(?:[2-6][0-9a-f]|7[0-9a-e]|[89a-f][0-9a-f]))+@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*|\[[0-9a-f.]*:[0-9a-f:.]*\])(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?)(?:\r?$|[/?# \t"'\]}) ,;])'''
secretGroup = 1
entropy = 0
keywords = ["postgres", "mysql", "mariadb", "mongodb", "redis", "rediss", "amqp"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''(?i)^[^\s"'=({,;\[\]})](?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqp|amqps)://''']
  # Exact encoded placeholder/reference forms are excluded only when they are
  # the whole password after the first raw userinfo colon. Embedded markers
  # remain literal candidates. This does not recursively decode userinfo.
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)://[^@:]*:(?:%24%7b[a-z_][a-z0-9_]*%7d|%24[a-z_][a-z0-9_]*|%25[a-z_][a-z0-9_]*%25|%3c[a-z_][a-z0-9_]*%3e|%7b%7b[a-z_][a-z0-9_]*%7d%7d)@''', '''(?i)://[^@]*%c2%[89][0-9a-f][^@]*@''', '''(?i)@\[[0-9a-f.:]*:::''']

[[rules]]
id = "literal-client-secret"
description = "Literal value assigned to an explicit client, application or API secret field"
regex = '''(?i)(?:^|[\s{,.])((?:["']?(?:client[_-]?secret(?:[_-]?value)?|clientsecret|app[_-]?secret|application[_-]?secret|api[_-]?secret|oauth[_-]?client[_-]?secret)["']?[ \t]*[:=][ \t]*(?:"[^"\r\n]{1,160}"|'[^'\r\n]{1,160}'|[^"'\s,;}\]]{1,160}["']?)))'''
secretGroup = 1
entropy = 0
keywords = ["secret"]
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^["']?(?:client[_-]?secret(?:[_-]?value)?|clientsecret|app[_-]?secret|application[_-]?secret|api[_-]?secret|oauth[_-]?client[_-]?secret)["']?\s*[:=]\s*["']?(?:your-client-secret|example-client-secret|placeholder-value|test-secret-placeholder|\$\{[a-z_][a-z0-9_]*\}?|%[a-z_][a-z0-9_]*%)["']?$''']
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^["']?(?:client[_-]?secret(?:[_-]?value)?|clientsecret|app[_-]?secret|application[_-]?secret|api[_-]?secret|oauth[_-]?client[_-]?secret)["']?\s*[:=]\s*(?:os\.environ\s*\[\s*["']|os\.environ\.get\s*\(\s*["']|os\.getenv\s*\(\s*["']|process\.env\.[a-z_][a-z0-9_]*|get_secret\s*\(\))["']?$''']

[[rules]]
id = "literal-password"
description = "Literal value assigned to a password, passphrase or common password alias"
regex = '''(?i)(?:^|[\s{,.])((?:["']?(?:password|passwd|passphrase|pwd|user[_-]?password|db[_-]?password|login[_-]?password|smtp[_-]?password|service[_-]?password)["']?[ \t]*[:=][ \t]*(?:"[^"\r\n]{1,160}"|'[^'\r\n]{1,160}'|[^"'\s,;}\]]{1,160}["']?)))'''
secretGroup = 1
entropy = 0
keywords = ["password", "passwd", "passphrase", "pwd"]
  # Only the entire, standalone Python-shaped lookup is exempt. Do not
  # exempt a prefix: a fallback or an appended expression can contain a secret.
  [[rules.allowlists]]
  regexTarget = "line"
  regexes = ['''^[ \t]*password[ \t]*=[ \t]*credentials\.get\([ \t]*(?:"password"|'password')[ \t]*,[ \t]*(?:""|'')[ \t]*\)[ \t]*,?[ \t]*\r?$''']
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^["']?(?:password|passwd|passphrase|pwd|user[_-]?password|db[_-]?password|login[_-]?password|smtp[_-]?password|service[_-]?password)["']?\s*[:=]\s*["']?(?:\$\{[a-z_][a-z0-9_]*\}?|%[a-z_][a-z0-9_]*%|<password>|<redacted>|placeholder-value|your-password|example-password|change[-_ ]?me|replace[-_ ]?me|not[-_ ]?a[-_ ]?secret|test|none|null|undefined)["']?$''']
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^["']?(?:password|passwd|passphrase|pwd|user[_-]?password|db[_-]?password|login[_-]?password|smtp[_-]?password|service[_-]?password)["']?\s*[:=]\s*(?:os\.environ\s*\[\s*["']|os\.environ\.get\s*\(\s*["']|os\.getenv\s*\(\s*["']|process\.env\.[a-z_][a-z0-9_]*|get_password\s*\(\))["']?$''']

[[rules]]
id = "xml-password"
description = "Literal password in XML application settings"
regex = '''(?i)\b((?:key|name)\s*=\s*["'](?:[^"'\r\n]{0,40}[_:.])?(?:password|passwd|pwd)["']\s+value\s*=\s*["'][^"'\r\n]{1,120}["'])'''
secretGroup = 1
entropy = 0
keywords = ["password", "passwd", "pwd"]
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''(?i)^(?:key|name)\s*=\s*["'](?:[^"'\r\n]{0,40}[_:.])?(?:password|passwd|pwd)["']\s+value\s*=\s*["'](?:\$\{[a-z_][a-z0-9_]*\}|%[a-z_][a-z0-9_]*%|<password>|<redacted>|placeholder-value|your-password|example-password|change[-_ ]?me|replace[-_ ]?me|not[-_ ]?a[-_ ]?secret|test|none|null|undefined)["']$''']
