[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-core"
version = "0.2.1a2"
description = "Offline secret scanning, Git guards, and auditable file inventory with explicit plugins"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "LeakGuard contributors"}]
dependencies = ["packaging>=24,<27", "psutil==7.2.2", "cachetools==7.2.5"]

[project.optional-dependencies]
documents = ["pypdf>=6,<7", "olefile>=0.47,<1"]

[project.scripts]
leakguard = "leakguard_core.cli:main"
leakguard-manage = "leakguard_core.manage:main"
leakguard-install-hooks = "leakguard_core.hooks:main"
leakguard-extensions = "leakguard_core.extension_cli:main"
leakguard-recognizer-profile = "leakguard_core.recognizer_profiles:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakguard_core = ["rules.toml"]
