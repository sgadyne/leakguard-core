[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-broker"
version = "0.1.0a2"
description = "Scoped mTLS credential custody broker (synthetic qualification)"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5", "leakguard-vault==0.1.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "hypothesis==6.151.9"]

[project.scripts]
leakguard-broker = "leakguard_broker.daemon:main"
leakguard-agent = "leakguard_broker.cli:main"
leakguard-admin = "leakguard_broker.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
