[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-vault"
version = "0.1.0"
description = "Encrypted local credentials and bounded LeakGuard observations"
requires-python = ">=3.11"
dependencies = ["leakguard-core>=0.2,<0.3", "cryptography==50.0.2"]

[project.optional-dependencies]
keyring = ["keyring==25.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
