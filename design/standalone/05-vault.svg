10" fill="#586F72" font-weight="700">LOCAL WORKSPACE</text><text x="26" y="895" font-family="Arial, sans-serif" font-size="12" fill="#173B43" font-weight="600">This Mac</text><text x="248" y="39" font-family="Arial, sans-serif" font-size="10" fill="#586F72" font-weight="600">WORKSPACE / VAULT</text><rect x="1125" y="18" width="114" height="26" rx="13" fill="#E4F1EA" stroke="none"/><text x="1137" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2D6B68" font-weight="600">Polling active</text><rect x="1256" y="16" width="96" height="36" rx="8" fill="#FFFFFF" stroke="#DCE5DF"/><text x="1272" y="39" font-family="Arial, sans-serif" font-size="12" fill="#173B43" font-weight="600">Pause</text><text x="248" y="101" font-family="Arial, sans-serif" font-size="29" fill="#173B43" font-weight="600">Vault</text><text x="248" y="130" font-family="Arial, sans-serif" font-size="14" fill="#586F72" font-weight="400">Your credential vault has its own independent unlock gate.</text><text x="248" y="911" font-family="Arial, sans-serif" font-size="10" fill="#586F72" font-weight="400">DESIGN FIXTURE · synthetic locations and counts · unavailable measurements must display “Not measured”</text><rect x="248" y="165" width="1152" height="91" rx="14" fill="#FFFFFF" stroke="#DCE5DF"/><text x="270" y="197" font-family="Arial, sans-serif" font-size="17" fill="#173B43" font-weight="600">Scan storage is available</text><text x="270" y="220" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Review and scanning can continue while the credential vault stays locked.</text><rect x="1202" y="193" width="173" height="26" rx="13" fill="#EAF1F8" stroke="none"/><text x="1214" y="210" font-family="Arial, sans-serif" font-size="11" fill="#385E7E" font-weight="600">Vault locked</text><rect x="248" y="280" width="706" height="583" rx="14" fill="#FFFFFF" stroke="#DCE5DF"/><g transform="translate(472 322) scale(1.375)"><rect x="4" y="14" width="152" height="132" rx="28" fill="#EDF2EE" stroke="none"/><circle cx="80" cy="80" r="48" fill="#E4F1EA"/><g transform="translate(52 52) scale(2.3333333333333335)" fill="none" stroke="#2D6B68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3 M12 14v3"/></g><circle cx="133" cy="27" r="6" fill="#FFF2DA"/><path d="M23 124h22 M34 113v22" stroke="#DCE5DF" stroke-width="2" stroke-linecap="round"/></g><text x="487" y="578" font-family="Arial, sans-serif" font-size="25" fill="#173B43" font-weight="600">Vault is locked</text><text x="370" y="612" font-family="Arial, sans-serif" font-size="13" fill="#586F72" font-weight="400">Unlock only when you need to save, reveal or copy a credential.</text><rect x="457" y="645" width="286" height="36" rx="8" fill="#2D6B68" stroke="none"/><text x="473" y="668" font-family="Arial, sans-serif" font-size="12" fill="#FFF" font-weight="600">Unlock credential vault</text><text x="387" y="710" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">OS session lock and app close lock the vault again.</text><text x="396" y="739" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Scan storage uses a separate key and lock state.</text><rect x="974" y="280" width="426" height="583" rx="14" fill="#FFFFFF" stroke="#DCE5DF"/><text x="996" y="312" font-family="Arial, sans-serif" font-size="17" fill="#173B43" font-weight="600">Review → save → verify</text><text x="996" y="335" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">A deliberate handoff, with no automatic source deletion.</text><rect x="1000" y="368" width="29" height="29" rx="15" fill="#E4F1EA" stroke="none"/><text x="1010" y="388" font-family="Arial, sans-serif" font-size="12" fill="#2D6B68" font-weight="600">1</text><text x="1045" y="388" font-family="Arial, sans-serif" font-size="15" fill="#173B43" font-weight="600">Review the source</text><text x="1000" y="423" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Check the current version and why it matched.</text><rect x="1000" y="471" width="29" height="29" rx="15" fill="#E4F1EA" stroke="none"/><text x="1010" y="491" font-family="Arial, sans-serif" font-size="12" fill="#2D6B68" font-weight="600">2</text><text x="1045" y="491" font-family="Arial, sans-serif" font-size="15" fill="#173B43" font-weight="600">Unlock and save</text><text x="1000" y="526" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Choose a label and confirm the destination.</text><rect x="1000" y="574" width="29" height="29" rx="15" fill="#E4F1EA" stroke="none"/><text x="1010" y="594" font-family="Arial, sans-serif" font-size="12" fill="#2D6B68" font-weight="600">3</text><text x="1045" y="594" font-family="Arial, sans-serif" font-size="15" fill="#173B43" font-weight="600">Verify the entry</text><text x="1000" y="629" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Confirm the vault accepted the credential.</text><rect x="1000" y="677" width="29" height="29" rx="15" fill="#E4F1EA" stroke="none"/><text x="1010" y="697" font-family="Arial, sans-serif" font-size="12" fill="#2D6B68" font-weight="600">4</text><text x="1045" y="697" font-family="Arial, sans-serif" font-size="15" fill="#173B43" font-weight="600">Recheck the original</text><text x="1000" y="732" font-family="Arial, sans-serif" font-size="12" fill="#586F72" font-weight="400">Its original copy may still need attention.</text><text x="1000" y="833" font-family="Arial, sans-serif" font-size="11" fill="#586F72" font-weight="400">Cancel safely at any step. Never imply “removed”.</text></svg>