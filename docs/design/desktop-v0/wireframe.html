<template id="tpl-first">
<div class="setup"><span class="label">Welcome to Password Buddy</span><h1 style="margin-top:8px">A local workspace, under your control</h1><p class="muted" style="margin-top:10px">Choose where to scan and keep the results on this device. Your credential vault is separate and optional.</p><div class="steps"><span class="step active"><b>1</b>Scan storage</span><span class="step"><b>2</b>Optional vault</span><span class="step"><b>3</b>First folder</span></div><section class="surface"><div class="setup-row"><span class="number">1</span><div><h2>Create encrypted scan storage</h2><p>Protect source paths, scan progress and redacted findings.</p></div><button class="primary" data-action="create-scan" id="setup-create-scan">Create storage</button></div><div class="setup-row"><span class="number">2</span><div><h2>Credential vault <span class="pill">Optional</span></h2><p>A separate store for credentials you explicitly save.</p></div><button data-action="create-vault">Create vault</button></div><div class="setup-row"><span class="number">3</span><div><h2>Choose a first folder</h2><p>Start small. You can add more locations later.</p></div><button data-action="setup-add" id="setup-add">Choose folder</button></div></section><div class="row spread" style="margin-top:20px"><span class="small muted">Existing encrypted files are opened with Unlock, never replaced.</span><button class="quiet" data-action="skip-setup">Skip for now →</button></div></div>
</template>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const names={overview:"Overview",sources:"Sources",findings:"Findings",vault:"Credential vault",plugins:"Plugins",settings:"Settings"};
let state={page:"overview",scenario:"ready",scan:true,vault:false,vaultCreated:true,empty:false,source:"docs",sourceTab:"sources",finding:0,history:false,review:{},job:"Waiting to retry",revealed:false,keyring:false};
let submitAction=null,toastTimer=null,focusReturn=null;
const findings=[
{severity:"Block",rule:"Private key material",location:"Projects/atlas/config/dev.pem",evidence:"Active",review:"Unreviewed",line:"1–28",part:"text",category:"Credentials",coverage:"Complete",verified:"Today, 09:18",classification:"Confirmed"},
{severity:"Review",rule:"Password assignment",location:"Documents/example.env",evidence:"Active",review:"Unreviewed",line:"12",part:"text",category:"Credentials",coverage:"Complete",verified:"Today, 10:42",classification:"Candidate"},
{severity:"Review",rule:"API token assignment",location:"Shared Archive/setup.txt",evidence:"Unknown",review:"Reviewed",line:"8",part:"text",category:"Credentials",coverage:"Incomplete",verified:"Yesterday, 16:30",classification:"Candidate"},
{severity:"Info",rule:"Credential reference",location:"Documents/notes.md",evidence:"Active",review:"Dismissed",line:"19",part:"text",category:"Credentials",coverage:"Complete",verified:"Today, 10:42",classification:"Reference"}
];
const sources={docs:{name:"Documents",path:"/Users/example/Documents",kind:"Local folder",coverage:"Complete",last:"Today, 10:42",schedule:"Daily",exclusions:"Drafts/Exports",files:"426"},repo:{name:"Atlas repository",path:"/Users/example/Projects/atlas",kind:"Local folder",coverage:"Complete",last:"Today, 09:18",schedule:"Manual",exclusions:"node_modules, dist",files:"82"},archive:{name:"Shared Archive",path:"/Volumes/Example Archive",kind:"Mounted share",coverage:"Incomplete",last:"Yesterday, 16:30",schedule:"Daily",exclusions:"None",files:"18"}};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function badge(v,kind){return '<span class="pill '+(kind||"")+'">'+esc(v)+'</span>';}
function kv(k,v,mono){return '<div class="kv"><span class="key">'+esc(k)+'</span><span class="'+(mono?'mono':'value')+'">'+esc(v)+'</span></div>';}
function toast(text){$("toast").textContent=text;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),4200);}
function heading(title,sub){return '<div class="heading"><div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div></div>';}
function gate(title,body,action,label,extra){return '<section class="gate"><span class="pill">Independent encrypted storage</span><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p><button class="primary" data-action="'+action+'">'+esc(label)+'</button>'+(extra||"")+'</section>';}
function render(){
state.revealed=false;
document.querySelectorAll(".nav button").forEach(b=>{b.classList.toggle("active",b.dataset.page===state.page);b.setAttribute("aria-current",b.dataset.page===state.page?"page":"false");});
$("crumb").textContent=names[state.page];
const scanPage=["overview","sources","findings"].includes(state.page);
if(state.scenario==="first") $("main").innerHTML=$("tpl-first").innerHTML;
else if(state.scenario==="disconnected") $("main").innerHTML=heading(names[state.page],"The local backend is unavailable.")+'<div class="notice bad"><span class="symbol">!</span><div><strong>Connection lost</strong><p>Current storage status cannot be verified. Sensitive reveals have been cleared.</p></div></div><section class="surface empty"><div class="empty-icon">↻</div><h2>Reconnect to your local workspace</h2><p>Buddy could not reach its backend. Your encrypted files remain on this device.</p><div class="row"><button class="primary" data-action="retry-connection">Retry connection</button><button data-action="diagnostics">Show details</button></div></section>';
else if(!state.scan && scanPage) $("main").innerHTML=heading(names[state.page],"Unlock scan storage to view this workspace.")+gate("Scan storage is locked","Sources, scan progress and findings are encrypted. Unlock scan storage to continue. The credential vault has its own separate lock.","unlock-scan","Unlock scan storage",'<div class="mini muted">Scanning is unavailable while this store is locked. '+(state.vault?'Your credential vault is still unlocked.':'Your credential vault remains locked.')+'</div>');
else if(state.page==="vault"&&!state.vault) $("main").innerHTML=heading("Credential vault","Credentials you explicitly save stay in a separate encrypted store.")+gate(state.vaultCreated?"Credential vault is locked":"Create your credential vault",state.vaultCreated?"Unlock to view saved credentials. Your scan jobs can continue independently.":"Choose a separate passphrase for the credentials you save here. You can keep scanning without creating this vault.",state.vaultCreated?"unlock-vault":"create-vault",state.vaultCreated?"Unlock credential vault":"Create credential vault",'<div class="mini"><button class="link" data-action="restore">Restore an encrypted backup →</button><p class="muted small">Scan storage: '+(state.scan?"Unlocked":"Locked")+'</p></div>');
else if(state.empty&&scanPage) renderEmpty();
else if(state.empty&&state.page==="vault") $("main").innerHTML=heading("Credential vault","Your separate encrypted credential store is unlocked.")+'<section class="surface empty"><div class="empty-icon">◇</div><h2>No saved credentials yet</h2><p>Add a credential yourself. Findings can prefill a title and location, but never a secret.</p><div class="row"><button class="primary" data-action="add-credential">Add credential</button><button data-action="restore">Restore backup</button></div></section>';
else{
$("main").innerHTML=$("tpl-"+state.page).innerHTML;
if(state.page==="sources")renderSourceView();
if(state.page==="findings")renderFindings();
if(state.page==="vault"&&state.credentialTitle){$("vault-entry-title").textContent=state.credentialTitle;$("vault-detail-title").textContent=state.credentialTitle;}
if(state.page==="settings"){
$("appearance").value=document.body.classList.contains("dark")?"dark":"light";
$("keyring").checked=state.keyring;
$("settings-scan-badge").textContent=state.scan?"Unlocked":"Locked";
$("settings-scan-badge").className="pill "+(state.scan?"good":"");
$("settings-scan-action").textContent=state.scan?"Lock scan storage":"Unlock scan storage";
if(!state.scan) $("settings-scan-action").parentElement.firstElementChild.textContent="Storage usage unavailable while locked";
}
if(state.scenario==="storageError"&&scanPage){
$("main").insertAdjacentHTML("afterbegin",'<div class="notice bad"><span class="symbol">!</span><div><strong>Scan progress could not be saved</strong><p>Scan storage reached its capacity limit. New scans are stopped. Existing encrypted evidence is preserved.</p><button class="link" data-action="storage-details">View recovery details →</button></div></div>');
$("main").querySelectorAll('[data-action="scan-now"]').forEach(b=>b.disabled=true);
}
}
if(state.scenario==="first"&&state.scan){$("setup-create-scan").textContent="Created";$("setup-create-scan").disabled=true;}
document.querySelectorAll("[data-vault-badge]").forEach(el=>{el.textContent=state.vault?"Unlocked":"Locked";el.classList.toggle("good",state.vault);});
const disconnected=state.scenario==="disconnected";
$("connection").innerHTML=disconnected?'<i class="dot bad"></i>Backend unavailable':'<i class="dot"></i>Connected locally';
$("scan-status").textContent="Scan storage: "+(disconnected?"Unknown":state.scan?"Unlocked":"Locked");
$("vault-status").textContent="Credential vault: "+(disconnected?"Unknown":state.vault?"Unlocked":state.vaultCreated?"Locked":"Not created");
$("background-status").textContent="Background after restart: "+(disconnected?"Unknown":state.keyring?"Available":"Unlock required");
}
function renderEmpty(){
const title=names[state.page];
$("main").innerHTML=heading(title,state.page==="findings"?"Coverage has not been established for any source.":"Choose a folder to start your local workspace.")+'<section class="surface empty"><div class="empty-icon">▱</div><h2>'+(state.page==="findings"?"No scan evidence yet":"No sources configured")+'</h2><p>Add a folder you want to check. You will choose when to scan it; an empty workspace does not establish coverage.</p><button class="primary" data-action="add-source">Add your first source</button></section>';
}
function renderSourceView(){
document.querySelectorAll("[data-source-tab]").forEach(b=>{b.classList.toggle("active",b.dataset.sourceTab===state.sourceTab);b.setAttribute("aria-selected",b.dataset.sourceTab===state.sourceTab);});
$("source-view").innerHTML=$("tpl-"+(state.sourceTab==="sources"?"source-list":state.sourceTab)).innerHTML;
if(state.sourceTab==="sources")renderSource();
if(state.sourceTab==="activity")updateJob();
}
function renderSource(){
const s=sources[state.source];
document.querySelectorAll("[data-source]").forEach(el=>el.classList.toggle("selected",el.dataset.source===state.source));
$("source-inspector").innerHTML='<div class="top"><span class="label">'+esc(s.kind)+'</span><h2>'+esc(s.name)+'</h2><p class="mono muted">'+esc(s.path)+'</p></div><div class="body">'+(state.source==="archive"?'<div class="notice warn no-margin"><div><strong>Source offline</strong><p>Reconnect this mounted share to resume scanning.</p></div></div>':"")+kv("Latest scan coverage",s.coverage)+kv("Last successful scan",s.last)+kv("Files checked in latest job",s.files)+kv("Excluded paths",s.exclusions,true)+'<div class="divider"></div><div class="field no-margin"><label for="source-schedule">Schedule</label><select id="source-schedule"><option'+(s.schedule==="Manual"?" selected":"")+'>Manual</option><option>Hourly</option><option'+(s.schedule==="Daily"?" selected":"")+'>Daily</option><option>Weekly</option></select></div><label class="check"><input type="checkbox" id="source-enabled" checked> Source enabled</label><div class="row"><button class="primary" data-action="scan-now">Scan now</button><button data-action="save-source">Save schedule</button></div><button class="link" data-action="scope-help">How to change this scope</button><div class="divider"></div><button class="quiet danger" data-action="remove-source">Remove source</button></div>';
}
function renderFindings(filtered){
const rows=filtered||findings.map((f,i)=>({...f,index:i,review:state.review[i]||f.review}));
$("findings-rows").innerHTML=rows.map(f=>'<tr class="selectable '+(state.finding===f.index?"selected":"")+'" data-finding="'+f.index+'" tabindex="0"><td>'+badge(f.severity,f.severity==="Block"?"bad":f.severity==="Review"?"warn":"")+'</td><td>'+esc(f.rule)+'</td><td class="location" title="'+esc(f.location)+'">'+esc(f.location)+'</td><td>'+badge(state.history?"Resolved":f.evidence,f.evidence==="Unknown"?"warn":"")+'</td><td>'+esc(f.review)+'</td></tr>').join("");
$("finding-count").textContent=rows.length+" rows on this page";
$("findings-empty").classList.toggle("hidden",rows.length>0);
if(rows.length&&!rows.some(r=>r.index===state.finding))state.finding=rows[0].index;
if(rows.length)renderFinding();else $("finding-inspector").innerHTML='<div class="pad muted small">Select a finding to inspect it.</div>';
}
function renderFinding(){
const f=findings[state.finding],review=state.review[state.finding]||f.review;
$("finding-inspector").innerHTML='<div class="top"><div class="row spread"><span class="label">Finding detail</span><button class="quiet" data-action="close-inspector" aria-label="Close finding details" style="min-height:24px;padding:0 5px">×</button></div><h2>'+esc(f.rule)+'</h2>'+badge(f.severity,f.severity==="Block"?"bad":"warn")+' '+badge(review)+'</div><div class="body">'+kv("Location","/Users/example/"+f.location,true)+kv("Part / lines",f.part+" · "+f.line)+kv("Evidence state",state.history?"Resolved":f.evidence)+kv("Classification",f.classification)+kv("Last verified",f.verified)+kv("Latest source coverage",f.coverage)+'<p class="small muted">Source coverage may be newer than this finding. Secret values are not included.</p><div class="divider"></div><div class="row"><button data-action="review-finding">'+(review==="Reviewed"?"Mark unreviewed":"Mark reviewed")+'</button><button class="quiet" data-action="dismiss-finding">'+(review==="Dismissed"?"Restore":"Dismiss")+'</button></div><button data-action="finding-to-vault">Add to credential vault…</button><button class="link" data-action="reveal-location">Reveal in folder →</button></div>';
$("finding-inspector").classList.remove("hidden");
document.querySelectorAll("[data-finding]").forEach(el=>el.classList.toggle("selected",Number(el.dataset.finding)===state.finding));
}
function showDialog(title,body,label,fn){
focusReturn=document.activeElement;
$("dialog-title").textContent=title;$("dialog-body").innerHTML=body;$("dialog-submit").textContent=label||"Continue";$("dialog-submit").classList.toggle("hidden",!label);submitAction=fn||null;
if(!$("dialog").open)$("dialog").showModal();
}
function closeDialog(){$("dialog").close();$("dialog-body").innerHTML="";submitAction=null;if(focusReturn&&focusReturn.isConnected)focusReturn.focus();}
function input(label,id,type,value,help){return '<div class="field"><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(value||"")+'" autocomplete="off">'+(help?'<small>'+esc(help)+'</small>':"")+'</div>';}
function unlock(which,create,next){
const isScan=which==="scan",title=(create?"Create ":"Unlock ")+(isScan?"scan storage":"credential vault");
showDialog(title,'<p class="dialog-help">Design simulation only. Use an invented passphrase, never a real credential.</p>'+input("Passphrase","pass","password","","At least 12 characters.")+(create?input("Confirm passphrase","confirm-pass","password"):'<button type="button" class="link small" data-action="wrong-pass">Preview incorrect passphrase error</button>'),create?"Create":"Unlock",()=>{
if($("pass").value.length<12||create&&$("pass").value!==$("confirm-pass").value){dialogError(create?"Use at least 12 characters and matching passphrases.":"Use an invented passphrase of at least 12 characters for this simulation.");return;}
if(isScan)state.scan=true;else{state.vault=true;state.vaultCreated=true;}closeDialog();render();toast((isScan?"Scan storage":"Credential vault")+" "+(create?"created":"unlocked")+" · simulated");if(next)next();
});
}
function dialogError(text){const old=$("dialog-body").querySelector(".dialog-error");if(old)old.remove();$("dialog-body").insertAdjacentHTML("afterbegin",'<div class="dialog-error" role="alert">'+esc(text)+'</div>');}
function addSource(){
if(!state.scan){unlock("scan",false,addSource);return;}
showDialog("Add a source",'<p class="dialog-help">Choose one exact folder. Mounted locations use your current OS access.</p><div class="folder-picks"><button type="button" data-path="/Users/example/Documents">▱ Documents</button><button type="button" data-path="/Users/example/Projects">▱ Projects</button></div>'+input("Selected folder","new-source-path","text","/Users/example/Documents")+'<div class="folder-browse"><span class="small muted">Example bounded folder browser</span><button type="button" data-path="/Users/example/Documents/Reports">▱ Reports　→</button><button type="button" data-path="/Users/example/Documents/Notes">▱ Notes　→</button></div><div class="two">'+input("Source name","new-source-name","text","","Optional")+ '<div class="field"><label for="new-schedule">Scan schedule</label><select id="new-schedule"><option>Manual scans</option><option>Hourly</option><option>Daily</option><option>Weekly</option></select></div></div><div class="field"><label for="new-exclusions">Excluded paths</label><textarea id="new-exclusions" rows="2" placeholder="Paths relative to the selected folder, one per line"></textarea></div>',"Add source",()=>{state.empty=false;state.scenario="ready";state.page="sources";state.sourceTab="sources";$("scenario").value="ready";closeDialog();render();toast("Source added · simulated. Choose Scan now when ready.");});
}
function credential(edit,linked){
if(!state.vault){unlock("vault",!state.vaultCreated,()=>credential(edit,linked));return;}
const f=findings[state.finding];
showDialog(edit?"Edit credential":"Add credential",'<p class="dialog-help">Synthetic prototype: enter invented example values only. Nothing is stored.</p>'+input("Title","credential-title","text",linked?f.rule:edit?state.credentialTitle||"Example service":"")+input(edit?"Replace secret (optional)":"Secret","credential-secret","password","",edit?"Leave blank to preserve the unrevealed secret.":"Enter it yourself; findings do not contain secret values.")+input("Username (optional)","credential-user","text","")+input("Location","credential-location","text",linked?"/Users/example/"+f.location:edit?"https://service.example.test":"")+'<div class="field"><label for="credential-notes">Notes</label><textarea id="credential-notes" rows="2"></textarea></div>'+(edit?'<p class="dialog-help">Existing username and notes stay unchanged unless you explicitly replace or clear them.</p><label class="check"><input type="checkbox"> Clear saved username</label><label class="check"><input type="checkbox"> Clear saved notes</label>':"")+(linked?'<p class="small muted">Linked finding: '+esc(f.rule)+'. Only title and location were prefilled.</p>':""),"Save credential",()=>{
if(!$("credential-title").value.trim()||(!edit&&!$("credential-secret").value)){dialogError("Enter a title and an invented secret before saving.");return;}
state.credentialTitle=$("credential-title").value;state.empty=false;state.page="vault";closeDialog();render();toast("Credential saved · simulated. Form values cleared.");
});
}
function backup(){showDialog("Create an encrypted credential backup",'<p class="dialog-help">This backs up saved credentials, not scan observations. This prototype does not write a file.</p>'+input("Backup passphrase","backup-pass","password")+input("Confirm backup passphrase","backup-confirm","password"),"Choose save location",()=>{if($("backup-pass").value.length<12||$("backup-pass").value!==$("backup-confirm").value){dialogError("Use matching invented passphrases of at least 12 characters.");return;}closeDialog();toast("Encrypted file save would open here · simulated; no download created.");});}
function restore(replace){
showDialog(replace?"Replace the credential vault?":"Restore an encrypted backup",replace?'<div class="notice bad no-margin"><div><strong>Replace existing saved credentials</strong><p>The current credential vault will be replaced by the selected backup. Make a backup of the current vault first if you need to keep it.</p></div></div><p class="dialog-help" style="margin-top:16px">This is a simulation. No files are changed.</p>':'<p class="dialog-help">Select a credential backup and choose a new vault passphrase. Example controls only; no file is read.</p>'+input("Encrypted backup file","restore-file","file")+input("Backup passphrase","restore-pass","password")+input("New vault passphrase","restore-new","password")+input("Confirm new passphrase","restore-confirm","password"),replace?"Replace vault":"Continue",()=>{
if(!replace){
if($("restore-pass").value.length<12||$("restore-new").value.length<12||$("restore-new").value!==$("restore-confirm").value){dialogError("Use invented passphrases of at least 12 characters and matching new passphrases.");return;}
closeDialog();if(state.vaultCreated){restore(true);return;}
}
state.vaultCreated=true;state.vault=true;state.empty=false;state.page="vault";closeDialog();render();toast("Credential backup restored · simulated.");
});
}
function updateJob(){
if(!$("job-state"))return;
$("job-state").textContent=state.job;
$("job-reason").textContent=state.job==="Running"?"Selected scope is being checked":state.job==="Paused"?"Paused by you":state.job==="Cancelled"?"Stopped before completion":"Source offline";
$("job-primary").textContent=state.job==="Running"?"Pause":"Resume";
$("job-primary").disabled=state.job==="Cancelled";
if(state.job==="Running")$("job-reason").insertAdjacentHTML("beforeend",'<div class="progress-line" aria-label="Scan running, total unknown"></div>');
}
function preview(s){
state.scenario=s;state.scan= !["first","scanLocked"].includes(s);state.vault=["vaultOpen","scanLocked","empty"].includes(s);state.vaultCreated=s!=="first";state.empty=s==="empty";state.revealed=false;
if(s==="first")state.page="overview";if(s==="vaultOpen")state.page="vault";if(s==="scanLocked")state.page="sources";
$("scenario").value=s;render();
}
function go(p){if(state.scenario==="first")state.scenario="ready";state.page=p;render();}
document.addEventListener("click",e=>{
const b=e.target.closest("button,[data-source],[data-finding]");if(!b)return;
if(b.dataset.page){go(b.dataset.page);return;}
if(b.dataset.path){$("new-source-path").value=b.dataset.path;return;}
if(b.dataset.source){state.source=b.dataset.source;renderSource();return;}
if(b.dataset.sourceTab){state.sourceTab=b.dataset.sourceTab;renderSourceView();return;}
if(b.dataset.finding){state.finding=Number(b.dataset.finding);renderFinding();return;}
if(b.dataset.findingView){state.history=b.dataset.findingView==="history";document.querySelectorAll("[data-finding-view]").forEach(x=>{x.classList.toggle("active",x===b);x.setAttribute("aria-selected",x===b);});renderFindings();return;}
const a=b.dataset.action;
if(!a)return;
switch(a){
case"theme":document.body.classList.toggle("dark");if($("appearance"))$("appearance").value=document.body.classList.contains("dark")?"dark":"light";break;
case"reset":state={page:"overview",scenario:"ready",scan:true,vault:false,vaultCreated:true,empty:false,source:"docs",sourceTab:"sources",finding:0,history:false,review:{},job:"Waiting to retry",revealed:false,keyring:false};preview("ready");break;
case"close-dialog":closeDialog();break;
case"help":showDialog("About this design prototype",'<p>This clickable HTML explores Password Buddy desktop v0. Every source, finding and credential is synthetic.</p><p>Use the preview-state selector to inspect first run, independently locked stores, empty data and failures. Buttons simulate the intended workflow. Nothing is scanned, saved, copied or sent.</p><p class="small muted">Visual primitives map to MUI. Findings map to AG Grid Community. Native lifecycle and packaging are specified separately.</p>',null);break;
case"unlock-scan":unlock("scan",false);break;case"unlock-vault":unlock("vault",false);break;case"create-scan":unlock("scan",true);break;case"create-vault":unlock("vault",true);break;
case"scan-status":if(state.scenario==="disconnected"){toast("Storage status is unknown until the backend reconnects.");break;}if(!state.scan){unlock("scan",false);break;}
case"lock-scan":showDialog("Lock scan storage?",'<p>Sources, findings and scan history will be hidden. Active work must finish its current bounded slice before storage can lock safely.</p><p class="small muted">The credential vault keeps its own current lock state.</p>',"Lock scan storage",()=>{state.scan=false;closeDialog();render();toast("Scan storage locked · simulated. Credential vault unchanged.");});break;
case"vault-status":if(state.scenario==="disconnected"){toast("Credential-vault status is unknown until the backend reconnects.");break;}if(!state.vault){unlock("vault",!state.vaultCreated);break;}
case"lock-vault":state.vault=false;state.revealed=false;render();toast("Credential vault locked. Scan storage unchanged · simulated.");break;
case"add-source":case"setup-add":addSource();break;
case"skip-setup":state.scenario="ready";state.empty=true;state.page="sources";$("scenario").value="empty";render();break;
case"source-docs":state.source="docs";state.sourceTab="sources";go("sources");break;case"source-repo":state.source="repo";state.sourceTab="sources";go("sources");break;case"offline-source":state.source="archive";state.sourceTab="sources";go("sources");break;case"activity":state.sourceTab="activity";go("sources");break;
case"scope-help":showDialog("Change a source's scope",'<p>To change its folder or excluded paths, add a new source with the scope you want. Existing source scope is read-only in v0.</p><p class="small muted">Earlier evidence stays in scan storage. Removing a source does not erase old reports.</p>',"Add a new source",()=>{closeDialog();addSource();});break;
case"save-source":sources[state.source].schedule=$("source-schedule").value;toast("Schedule and enabled state saved · simulated.");break;
case"remove-source":showDialog("Remove this source?",'<p>Remove '+esc(sources[state.source].name)+' from configured sources and future scheduling?</p><p class="small muted">Existing evidence is retained. If a scan slice is stopping, removal must wait.</p>',"Remove source",()=>{closeDialog();state.empty=true;render();toast("Source removed · simulated empty-state preview.");});break;
case"scan-now":state.job="Running";state.sourceTab="activity";renderSourceView();toast("Scan started · simulated.");break;
case"resume-job":state.job=state.job==="Running"?"Paused":"Running";updateJob();break;
case"cancel-job":showDialog("Cancel this scan?",'<p>Stop the current job after its bounded scan slice unwinds. Coverage will remain incomplete.</p>',"Cancel scan",()=>{state.job="Cancelled";closeDialog();updateJob();toast("Cancellation acknowledged · simulated.");});break;
case"check-guards":$("guards-result").classList.remove("hidden");break;
case"install-guards":if($("guard-button").textContent==="Remove guards"){$("guard-state").textContent="Not installed";$("guard-button").textContent="Install guards";toast("Repository guards removed · simulated.");}else{$("guard-state").textContent="Installed";$("guard-state").classList.add("good");$("guard-button").textContent="Remove guards";$("guard-info").textContent="Effective config: /Users/example/Projects/atlas/.leakguard/profile.json · "+$("guard-profile").value+" · Strict worker policy";toast("Guards installed for this selected repository · simulated.");}break;
case"refresh":toast("Latest local state refreshed · simulated.");break;
case"review-finding":state.review[state.finding]=(state.review[state.finding]||findings[state.finding].review)==="Reviewed"?"Unreviewed":"Reviewed";renderFindings();toast("Review label updated · engine evidence unchanged.");break;
case"dismiss-finding":state.review[state.finding]=(state.review[state.finding]||findings[state.finding].review)==="Dismissed"?"Unreviewed":"Dismissed";renderFindings();toast("Review label updated · Git enforcement unchanged.");break;
case"finding-to-vault":credential(false,true);break;
case"reveal-location":toast("The OS file manager would reveal this location · simulated.");break;
case"close-inspector":$("finding-inspector").classList.add("hidden");document.querySelector('[data-finding="'+state.finding+'"]')?.focus();break;
case"next-findings":$("findings-rows").innerHTML="";$("finding-count").textContent="0 rows on this page · end of results";$("next-page").disabled=true;$("findings-empty").classList.remove("hidden");$("finding-inspector").classList.add("hidden");toast("Empty final page preview. Previous evidence is not a clean verdict.");break;
case"reset-filters":$("filter-form").reset();$("next-page").disabled=false;renderFindings();break;
case"add-credential":credential(false,false);break;case"edit-credential":credential(true,false);break;case"backup":backup();break;case"restore":restore(false);break;
case"reveal":state.revealed=!state.revealed;$("secret-value").textContent=state.revealed?"example-only-not-a-secret":"••••••••••••";$("secret-value").style.letterSpacing=state.revealed?"0":"4px";$("secret-value").style.fontSize=state.revealed?"14px":"20px";$("sensitive-meta").textContent=state.revealed?"Username: example-user · Notes: Synthetic example only.":"Username and notes are hidden until you reveal details.";$("reveal-button").textContent=state.revealed?"Hide details":"Reveal details";break;
case"copy-secret":toast("Copy secret simulated · the system clipboard was not changed.");break;
case"delete-credential":showDialog("Delete this saved credential?",'<p>Delete this credential from the current vault? Existing encrypted backups will not be changed.</p>',"Delete credential",()=>{closeDialog();state.empty=true;render();toast("Credential deleted · simulated.");});break;
case"select-credential":break;
case"install-plugin":showDialog("Install a reviewed local wheel",'<p class="dialog-help">Choose a wheel from this device. Installation does not enable the plugin.</p>'+input("Wheel file","wheel-file","file")+'<label class="check"><input type="checkbox" id="plugin-trust"> I reviewed and trust this plugin code.</label>',"Install and inspect",()=>{if(!$("plugin-trust").checked){dialogError("Confirm code review before installation.");return;}closeDialog();showDialog("Plugin installed · inspect before enabling",'<div class="notice no-margin"><div><strong>Example extension</strong><p>Local wheel installed · synthetic conformance result: Passed</p></div></div><div class="field" style="margin-top:20px"><label for="enable-profile">Enable in profile</label><select id="enable-profile"><option>Sensitive information</option><option>Firm</option></select></div>',"Enable in profile",()=>{closeDialog();toast("Extension enabled in selected profile · simulated.");});});break;
case"check-plugin":$("plugin-check-state").textContent="Passed";toast("Conformance check completed · simulated.");break;
case"toggle-plugin":const enabled=$("plugin-toggle").textContent.startsWith("Disable");$("plugin-toggle").textContent=enabled?"Enable in profile":"Disable in profile";$("plugin-profile-state").textContent=enabled?"Not enabled":"Sensitive information";toast("Profile membership changed · simulated.");break;
case"save-settings":toast("Scan settings saved · simulated. Changed policy may require rechecking evidence.");break;
case"retry-connection":preview("ready");toast("Local connection restored · simulated.");break;
case"diagnostics":showDialog("Local connection details",'<p class="mono">backend-unreachable</p><p class="small muted">The app could not connect to its local backend. Reopen or retry the connection. No source path, credential or passphrase appears in diagnostics.</p>',"Retry",()=>{closeDialog();preview("ready");});break;
case"storage-details":showDialog("Scan storage needs attention",'<p class="mono">state-capacity-limit</p><p>New scans are stopped because encrypted scan progress could not be saved. Existing encrypted data is retained.</p><p class="small muted">Do not automatically delete or recreate storage. The built app will expose safe diagnostics and reopen guidance.</p>',"Close",closeDialog);break;
case"wrong-pass":dialogError("Passphrase was incorrect or storage could not authenticate.");$("pass").value="";$("pass").focus();break;
case"tray":showDialog("Menu bar / notification-area preview",'<div class="tray-menu"><div class="menu-status">Password Buddy · local workspace<br>Scan storage: '+(state.scan?"unlocked":"locked")+'<br>Credential vault: '+(state.vault?"unlocked":"locked")+'</div><div class="divider"></div><button type="button" data-action="tray-open">Open Password Buddy</button><button type="button" data-action="tray-sources">Open Sources</button><button type="button" data-action="tray-lock" '+(!state.vault?"disabled":"")+'>Lock credential vault</button><button type="button" data-action="tray-settings">Settings…</button><div class="divider"></div><button type="button" data-action="tray-quit">Quit Password Buddy</button></div><p class="dialog-help" style="margin:16px 0 0">Native shell illustration. Global Pause schedules is omitted because the API has no equivalent operation.</p>',null);break;
case"tray-open":closeDialog();break;case"tray-sources":closeDialog();go("sources");break;case"tray-settings":closeDialog();go("settings");break;case"tray-lock":state.vault=false;closeDialog();render();toast("Credential vault locked · simulated.");break;case"tray-quit":closeDialog();showDialog("Quit Password Buddy",'<p>The desktop app will stop its owned backend safely. External CLI or service processes are unaffected.</p><p class="small muted">This prototype stays open; no process is stopped.</p>',"Finish preview",closeDialog);break;
}
});
$("dialog-form").addEventListener("submit",e=>{e.preventDefault();if(submitAction)submitAction();});
$("dialog").addEventListener("cancel",()=>{setTimeout(()=>{$("dialog-body").innerHTML="";submitAction=null;},0);});
$("scenario").addEventListener("change",e=>preview(e.target.value));
document.addEventListener("submit",e=>{if(e.target.id!=="filter-form")return;e.preventDefault();const review=$("review-filter").value,severity=$("severity-filter").value,cat=$("category-filter").value,rule=$("rule-filter").value.toLowerCase(),path=$("path-filter").value.toLowerCase();renderFindings(findings.map((f,i)=>({...f,index:i,review:state.review[i]||f.review})).filter(f=>(!review||f.review===review)&&(!severity||f.severity===severity)&&(!cat||f.category===cat)&&f.rule.toLowerCase().includes(rule)&&f.location.toLowerCase().includes(path)));});
document.addEventListener("change",e=>{if(e.target.id==="appearance"){const dark=e.target.value==="dark"||e.target.value==="system"&&matchMedia("(prefers-color-scheme: dark)").matches;document.body.classList.toggle("dark",dark);}if(e.target.id==="keyring"){state.keyring=e.target.checked;$("keyring-help").textContent=state.keyring?"Native scan-key storage verified · synthetic success. Credential vault still requires explicit unlock.":"Scan storage requires foreground unlock after restart.";toast("Background access preference changed · simulated.");$("background-status").textContent="Background after restart: "+(state.keyring?"Available":"Unlock required");}});
document.addEventListener("input",e=>{if(e.target.id==="vault-search"){const match=($("vault-entry-title").textContent||"").toLowerCase().includes(e.target.value.toLowerCase());document.querySelector(".vault-entry").classList.toggle("hidden",!match);}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-source],[data-finding]")){e.preventDefault();e.target.click();}});
render();
})();
</script>
</body></html>
