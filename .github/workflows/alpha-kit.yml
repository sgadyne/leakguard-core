name: Alpha deployment kits
on: [push, pull_request]
jobs:
  alpha-kit:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin isolated staging build tools
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - name: Build exact tracked target deployment kit
        shell: bash
        run: python deploy/cli/build.py --output "$RUNNER_TEMP/alpha-dist" --target '${{ matrix.target }}'
      - name: Extract complete target kit
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archives = list((root / 'alpha-dist').glob('leakguard-cli-*.zip'))
          assert len(archives) == 1
          with zipfile.ZipFile(archives[0]) as z:
              z.extractall(root / 'alpha-kit')
          PY
      - name: Offline fresh install, exact verification and repeated synthetic smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python alpha-kit/kit.py install --env "$RUNNER_TEMP/alpha-runtime"
          python alpha-kit/kit.py verify --env "$RUNNER_TEMP/alpha-runtime"
          python alpha-kit/kit.py smoke --env "$RUNNER_TEMP/alpha-runtime"
          python alpha-kit/kit.py smoke --env "$RUNNER_TEMP/alpha-runtime"
      - name: Exercise prior alpha upgrade and rollback on native platform
        shell: bash
        run: >-
          python -I tools/qualify_alpha_upgrade.py
          --repository "$GITHUB_WORKSPACE"
          --kit "$RUNNER_TEMP/alpha-kit"
          --kit-archive "$RUNNER_TEMP/alpha-dist/leakguard-cli-*.zip"
          --output-dir "$RUNNER_TEMP/alpha-upgrade"
      - name: Retain native upgrade and rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-upgrade-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/alpha-upgrade/receipt.json
          if-no-files-found: error
      - name: Retain exact target deployment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-kit-${{ matrix.target }}
          path: ${{ runner.temp }}/alpha-dist/*
          if-no-files-found: error
