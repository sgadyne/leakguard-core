name: Alpha checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: Installed alpha regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            plugins/presidio_detector/requirements-py311.lock
            .github/workflows/quick.yml
      - name: Install locked analyzer dependencies and build tools
        run: |
          python -m pip install --require-hashes -r plugins/presidio_detector/requirements-py311.lock
          python -m pip install setuptools==80.9.0 wheel==0.45.1 pytest==9.1.1
      - name: Build and install current product wheels
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" . ./plugins/credential_detector ./plugins/presidio_detector ./plugins/jose_recognizers ./packages/leakguard_vault ./packages/leakguard_host ./apps/buddy
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
          python -m pip check
          python tools/install_gitleaks.py .tools
      - name: Check installed bytes, filters, vault, backfill and cache safety
        run: |
          printf '{}\n' > "$RUNNER_TEMP/alpha-config.json"
          export LEAKGUARD_CONFIG="$RUNNER_TEMP/alpha-config.json"
          export LEAKGUARD_STATE_DIR="$RUNNER_TEMP/alpha-state"
          export LEAKGUARD_GITLEAKS="$GITHUB_WORKSPACE/.tools/gitleaks"
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tools/check_alpha_ci.py" --source-root "$GITHUB_WORKSPACE" --junit "$RUNNER_TEMP/alpha-junit.xml"
      - name: Retain synthetic test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-check-results
          path: ${{ runner.temp }}/alpha-junit.xml
          if-no-files-found: warn
          retention-days: 7
