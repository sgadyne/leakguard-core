name: Synthetic checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']
        documents: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core without document parsers
        if: ${{ !matrix.documents }}
        run: python -m pip install -e .
      - name: Install core with optional document parsers
        if: ${{ matrix.documents }}
        run: python -m pip install -e ".[documents]"
      - run: python tools/install_gitleaks.py .tools
      - name: Check Windows execution boundary first
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          printf '{}\n' > "$RUNNER_TEMP/leakguard-config.json"
          export LEAKGUARD_CONFIG="$RUNNER_TEMP/leakguard-config.json"
          export LEAKGUARD_STATE_DIR="$RUNNER_TEMP/leakguard-preflight-state"
          export PATH="$PWD/.tools:$PATH"
          python -m unittest discover -s tests -p test_execution.py -v
      - name: Test with isolated runtime state
        shell: bash
        run: |
          printf '{}\n' > "$RUNNER_TEMP/leakguard-config.json"
          export LEAKGUARD_CONFIG="$RUNNER_TEMP/leakguard-config.json"
          export LEAKGUARD_STATE_DIR="$RUNNER_TEMP/leakguard-state"
          export PATH="$PWD/.tools:$PATH"
          python -m unittest discover -s tests -v
          python -m compileall -q src

  installed-wheel:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.13']
        documents: [false, true]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Gitleaks
        run: python tools/install_gitleaks.py .tools
      - name: Prepare private test configuration
        run: printf '{"worker_policy":"strict"}\n' > "$RUNNER_TEMP/leakguard-config.json"
      - name: Build and test the installed wheel without parser extras
        if: ${{ !matrix.documents }}
        run: >-
          python tools/run_acceptance.py
          --mode wheel
          --output "$RUNNER_TEMP/leakguard-wheel-acceptance.json"
          --gitleaks "$PWD/.tools/gitleaks"
          --config "$RUNNER_TEMP/leakguard-config.json"

      - name: Build and test the installed wheel with document parsers
        if: ${{ matrix.documents }}
        run: >-
          python tools/run_acceptance.py
          --mode wheel
          --documents-extra
          --output "$RUNNER_TEMP/leakguard-wheel-acceptance.json"
          --gitleaks "$PWD/.tools/gitleaks"
          --config "$RUNNER_TEMP/leakguard-config.json"

      - name: Summarize failed installed-wheel receipt
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = Path(os.environ['RUNNER_TEMP']) / 'leakguard-wheel-acceptance.json'
          if receipt.is_file():
              value = json.loads(receipt.read_text())
              print(json.dumps({key: value.get(key) for key in ('outcome', 'failed_stage', 'test_summary')}))
          PY

  presidio-smoke:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install core and hashed pattern-only dependencies
        run: |
          python -m pip install .
          python -m pip install --require-hashes -r plugins/presidio_detector/requirements-py311.lock
      - name: Install adapter and synthetic firm recognizer as wheels
        run: >-
          python -m pip install --no-deps
          ./plugins/presidio_detector
          ./plugins/jose_recognizers
          ./plugins/presidio_detector/examples/firm_presidio_recognizer
      - name: Check installed JOSE, firm adapter and owned worker session
        run: python -I tools/check_presidio_smoke.py
      - name: Check JOSE vectors and adapter regressions
        run: |
          python -m pip install pytest==8.4.2 cryptography==50.0.2
          python -I -m pytest plugins/jose_recognizers/tests plugins/presidio_detector/tests -k "not test_required_spacy_ner_uses_configured_model_without_fallback and not test_required_ner_rejects_a_model_for_the_wrong_language and not test_required_ner_rejects_a_mismatched_model_identity" -q

  broker-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build fresh broker, vault and core wheels
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" . ./packages/leakguard_vault ./packages/leakguard_broker
      - name: Install pinned runtime and test tools
        run: |
          python -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheels/*.whl
          python -m pip install -r packages/leakguard_broker/requirements-py311.lock
          python -m pip install pytest==9.0.2 pytest-asyncio==1.3.0 hypothesis==6.151.9
          python -m pip check
      - name: Exercise installed broker outside the source checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/suite/packages/leakguard_broker" "$RUNNER_TEMP/suite/tools"
          cp -R packages/leakguard_broker/tests "$RUNNER_TEMP/suite/packages/leakguard_broker/"
          cp tools/installed_acceptance.py "$RUNNER_TEMP/suite/tools/"
          cd "$RUNNER_TEMP/suite"
          python -I -c 'import leakguard_broker; assert "site-packages" in leakguard_broker.__file__'
          python -I -m pytest packages/leakguard_broker/tests -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function -q
