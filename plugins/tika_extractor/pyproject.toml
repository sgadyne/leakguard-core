[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-tika-extractor"
version = "0.1.0a1"
description = "Local persistent Apache Tika v2 document extractor for LeakGuard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["leakguard-core>=0.2.1a1,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakguard_tika_extractor = ["leakguard-plugin.json"]
