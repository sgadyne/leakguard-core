[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-sensitive-basics"
version = "0.1.0"
description = "Contextual synthetic-safe PII and identifier detector for LeakGuard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["leakguard-core>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensitive_basics = ["cases.json", "leakguard-plugin.json"]
