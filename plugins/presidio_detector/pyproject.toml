[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard-presidio-detector"
version = "0.1.0a1"
description = "LeakGuard detector adapter for the Presidio Analyzer API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "leakguard-core>=0.2.1a1,<0.3.0",
  "presidio-analyzer==2.2.365",
  "tldextract==5.4.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presidio_detector = ["cases.json", "leakguard-plugin.json"]
