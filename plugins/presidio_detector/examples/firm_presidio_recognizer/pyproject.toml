[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "example-firm-presidio-recognizer"
version = "0.1.0"
description = "Synthetic custom Presidio recognizer package for LeakGuard"
requires-python = ">=3.11,<3.12"
dependencies = ["presidio-analyzer==2.2.365"]

[tool.setuptools.packages.find]
where = ["src"]
